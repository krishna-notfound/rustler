[project]
name = "rustler-engine"
version = "0.1.0"
description = "Rustler Python worker: transcription, scene detection, transliteration over stdio JSON-RPC"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "indic-transliteration>=2.3.82",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "scenedetect>=0.7.3",
]

[project.optional-dependencies]
full = []
cuda = ["nvidia-cublas-cu12<12.9", "nvidia-cudnn-cu12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rustler_engine"]

[tool.pytest.ini_options]
markers = ["slow: downloads models/audio and runs real transcription"]
addopts = "-m 'not slow' --basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
