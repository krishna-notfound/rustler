[package]
name = "rustler-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "rustler_cli"
path = "src/lib.rs"

[[bin]]
name = "rustler"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rustler-commands.workspace = true
rustler-core.workspace = true
rustler-desktop = { version = "0.2.3", path = "../rustler-desktop" }
rustler-gui = { version = "0.2.3", path = "../rustler-gui" }
rustler-mcp = { version = "0.2.3", path = "../rustler-mcp" }
rustler-registry.workspace = true
rustler-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
schemars.workspace = true
serde_json.workspace = true
tempfile.workspace = true
