[package]
name = "rustler-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["embed-engine"]
# Embed the Python engine (`engine/`) in the binary; `setup` extracts it to `home/engine`.
embed-engine = []

[dependencies]
chrono.workspace = true
flate2.workspace = true
futures-util.workspace = true
include_dir.workspace = true
reqwest.workspace = true
rustler-captions.workspace = true
rustler-core.workspace = true
rustler-registry.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
xz2.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
